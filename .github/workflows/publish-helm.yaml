name: Publish Helm Chart

# Trigger on release events for main and helm-chart branches
on:
  release:
    types: [published]
    branches:
      - main
      - helm-chart
  workflow_call:
    inputs:
      version:
        description: "Release version without prefix (for example 1.2.3), used for image tags, chart version and the binary version"
        type: string
        required: false
        default: ""
      ref:
        description: "Commit to build, empty for the commit of the triggering event"
        type: string
        required: false
        default: ""
      tag:
        description: "Git tag of the release (with the prefix style of the repository), only used to serialize runs of the same release"
        type: string
        required: false
        default: ""
      previous_tag:
        description: "Newest release tag at planning time; the run is refused when a newer release exists by now"
        type: string
        required: false
        default: ""

# Runs that publish the same release share a group, so a manual release and a nightly release of the same version cannot
# publish at the same time: the later one starts after the first has created the tag and its stale-plan guard refuses it.
# All other runs (branches, pull requests) get a group of their own and are not serialized.
concurrency:
  group: ${{ inputs.version != '' && format('release-chart-{0}', inputs.tag) || github.event_name == 'release' && format('release-chart-{0}', github.event.release.tag_name) || format('build-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  CHART_DIR: chart
  HELM_VERSION: v3.12.3

jobs:
  build:
    name: Build and Validate Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Refuse to publish an outdated release plan
        if: ${{ inputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          REF: ${{ inputs.ref || github.sha }}
        run: |
          # A re-run of an older nightly run reuses its plan; it must not overwrite a version that a later run released
          # or publish commits that are no longer the head of main.
          set -euo pipefail
          # The tag exists with or without the `v` prefix
          # Fetched on its own, so that a failing API call aborts the step instead of counting as "no tag found"
          refs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/" --jq ".[].ref")
          existing=$(printf '%s\n' "$refs" | grep -cxE "refs/tags/v?${VERSION//./\\.}" || true)
          if [[ "$existing" != "0" ]]; then
            echo "Tag ${VERSION} (or v${VERSION}) already exists, so this plan is outdated. Start a new run of the nightly workflow." >&2
            exit 1
          fi
          # A release that was published after the plan was made (for example a manual minor release) makes the plan obsolete as well
          if [[ -n "$PREVIOUS_TAG" ]]; then
            newest=$(printf '%s\n' "$refs" | sed 's#^refs/tags/##' | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
              | while read -r t; do echo "${t#v} $t"; done | sort -V -k1,1 | tail -1 | cut -d' ' -f2 || true)
            if [[ "$newest" != "$PREVIOUS_TAG" ]]; then
              echo "The newest release is ${newest:-none}, but the plan was made from ${PREVIOUS_TAG}. Start a new run of the nightly workflow." >&2
              exit 1
            fi
          fi
          main=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [[ "$main" != "$REF" ]]; then
            echo "Planned commit $REF is not the head of main ($main) any more. Start a new run of the nightly workflow." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Update chart version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Version of the call (nightly release) or of the release tag, 'v' prefix removed if present
          VERSION=${INPUT_VERSION:-${GITHUB_REF#refs/tags/}}
          VERSION=${VERSION#v}
          echo "Setting chart version and appVersion to: ${VERSION}"
          # Synchronize 'version' and 'appVersion' fields in Chart.yaml to ensure consistency.
          # This project uses the same version for both the chart and the application it deploys.
          yq e -i '.version = "'${VERSION}'"' ${{ env.CHART_DIR }}/Chart.yaml
          yq e -i '.appVersion = "'${VERSION}'"' ${{ env.CHART_DIR }}/Chart.yaml

      - name: Lint chart
        run: helm lint ${{ env.CHART_DIR }}

      - name: Validate chart template
        run: helm template ${{ env.CHART_DIR }}

      - name: Package chart
        run: helm package ${{ env.CHART_DIR }}

      - name: Upload chart artifact
        if: ${{ !github.event.act }}
        uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: ./*.tgz

  publish:
    name: Publish to Registry
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Skip this job when running with Act
    if: ${{ !github.event.act }}
    steps:
      - name: Refuse to publish an outdated release plan
        if: ${{ inputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
          REF: ${{ inputs.ref || github.sha }}
        run: |
          # A re-run of an older nightly run reuses its plan; it must not overwrite a version that a later run released
          # or publish commits that are no longer the head of main.
          set -euo pipefail
          # The tag exists with or without the `v` prefix
          # Fetched on its own, so that a failing API call aborts the step instead of counting as "no tag found"
          refs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/" --jq ".[].ref")
          existing=$(printf '%s\n' "$refs" | grep -cxE "refs/tags/v?${VERSION//./\\.}" || true)
          if [[ "$existing" != "0" ]]; then
            echo "Tag ${VERSION} (or v${VERSION}) already exists, so this plan is outdated. Start a new run of the nightly workflow." >&2
            exit 1
          fi
          # A release that was published after the plan was made (for example a manual minor release) makes the plan obsolete as well
          if [[ -n "$PREVIOUS_TAG" ]]; then
            newest=$(printf '%s\n' "$refs" | sed 's#^refs/tags/##' | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
              | while read -r t; do echo "${t#v} $t"; done | sort -V -k1,1 | tail -1 | cut -d' ' -f2 || true)
            if [[ "$newest" != "$PREVIOUS_TAG" ]]; then
              echo "The newest release is ${newest:-none}, but the plan was made from ${PREVIOUS_TAG}. Start a new run of the nightly workflow." >&2
              exit 1
            fi
          fi

      - name: Download chart artifact
        uses: actions/download-artifact@v8
        with:
          name: helm-chart

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to registry
        run: |
          echo "Publishing Helm chart to ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.CHART_DIR }}"
          helm push *.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.CHART_DIR }}

  # Announces manual releases (published GitHub release) in the Teams release channel. Builds called by the nightly
  # release workflow are announced there, and branch and pull request builds are not announced. The steps skip
  # themselves while the secret is empty.
  notify-release:
    name: Notify Teams
    needs: [build, publish]
    if: ${{ always() && github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      MS_TEAMS_RELEASE_WEBHOOK: ${{ secrets.STEADOPS_RELEASE_MS_TEAMS_WEBHOOK }}
    steps:
    - name: Name the version without prefix
      run: echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      env:
        TAG: ${{ github.event.release.tag_name }}
    - name: Notify MS Teams about the published chart
      if: ${{ needs.publish.result == 'success' && env.MS_TEAMS_RELEASE_WEBHOOK != '' }}
      continue-on-error: true
      uses: steadforce/steadops-workflows/.github/actions/teams-notification@v4.3.0
      with:
        webhook-url: ${{ env.MS_TEAMS_RELEASE_WEBHOOK }}
        status: success
        title: "Chart ${{ github.event.release.tag_name }} published"
        facts: |
          Chart=oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.CHART_DIR }}/harbor-day2-operator:${{ env.RELEASE_VERSION }}
          Release=${{ github.event.release.html_url }}
    - name: Notify MS Teams about the failed chart
      if: ${{ needs.publish.result != 'success' && env.MS_TEAMS_RELEASE_WEBHOOK != '' }}
      continue-on-error: true
      uses: steadforce/steadops-workflows/.github/actions/teams-notification@v4.3.0
      with:
        webhook-url: ${{ env.MS_TEAMS_RELEASE_WEBHOOK }}
        status: failure
        title: "Chart ${{ github.event.release.tag_name }} failed"
        facts: |
          Build=${{ needs.build.result }}
          Publish=${{ needs.publish.result }}
          Release=${{ github.event.release.html_url }}
