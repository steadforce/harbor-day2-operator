name: Publish Helm Chart

# Trigger on release events for main and helm-chart branches
on:
  release:
    types: [published]
    branches:
      - main
      - helm-chart
  workflow_call:
    inputs:
      version:
        description: "Release version without prefix (for example 1.2.3), used for image tags, chart version and the binary version"
        type: string
        required: false
        default: ""
      ref:
        description: "Commit to build, empty for the commit of the triggering event"
        type: string
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  CHART_DIR: chart
  HELM_VERSION: v3.12.3

jobs:
  build:
    name: Build and Validate Chart
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Refuse to publish an outdated release plan
        if: ${{ inputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref || github.sha }}
        run: |
          # A re-run of an older nightly run reuses its plan; it must not overwrite a version that a later run released
          # or publish commits that are no longer the head of main.
          set -euo pipefail
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${VERSION}" --jq "map(select(.ref == \"refs/tags/${VERSION}\")) | length")
          if [[ "$existing" != "0" ]]; then
            echo "Tag ${VERSION} already exists, so this plan is outdated. Start a new run of the nightly workflow." >&2
            exit 1
          fi
          main=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          if [[ "$main" != "$REF" ]]; then
            echo "Planned commit $REF is not the head of main ($main) any more. Start a new run of the nightly workflow." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Update chart version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Version of the call (nightly release) or of the release tag, 'v' prefix removed if present
          VERSION=${INPUT_VERSION:-${GITHUB_REF#refs/tags/}}
          VERSION=${VERSION#v}
          echo "Setting chart version and appVersion to: ${VERSION}"
          # Synchronize 'version' and 'appVersion' fields in Chart.yaml to ensure consistency.
          # This project uses the same version for both the chart and the application it deploys.
          yq e -i '.version = "'${VERSION}'"' ${{ env.CHART_DIR }}/Chart.yaml
          yq e -i '.appVersion = "'${VERSION}'"' ${{ env.CHART_DIR }}/Chart.yaml

      - name: Lint chart
        run: helm lint ${{ env.CHART_DIR }}

      - name: Validate chart template
        run: helm template ${{ env.CHART_DIR }}

      - name: Package chart
        run: helm package ${{ env.CHART_DIR }}

      - name: Upload chart artifact
        if: ${{ !github.event.act }}
        uses: actions/upload-artifact@v7
        with:
          name: helm-chart
          path: ./*.tgz

  publish:
    name: Publish to Registry
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Skip this job when running with Act
    if: ${{ !github.event.act }}
    steps:
      - name: Refuse to publish an outdated release plan
        if: ${{ inputs.version != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REF: ${{ inputs.ref || github.sha }}
        run: |
          # A re-run of an older nightly run reuses its plan; it must not overwrite a version that a later run released
          # or publish commits that are no longer the head of main.
          set -euo pipefail
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${VERSION}" --jq "map(select(.ref == \"refs/tags/${VERSION}\")) | length")
          if [[ "$existing" != "0" ]]; then
            echo "Tag ${VERSION} already exists, so this plan is outdated. Start a new run of the nightly workflow." >&2
            exit 1
          fi

      - name: Download chart artifact
        uses: actions/download-artifact@v8
        with:
          name: helm-chart

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to registry
        run: |
          echo "Publishing Helm chart to ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.CHART_DIR }}"
          helm push *.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.CHART_DIR }}
