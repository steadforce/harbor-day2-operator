name: Create and publish k8s workbench container image

on:
  push:
    branches:
    - "**"
  pull_request:
    branches:
    - "main"
  release:
    types: [published]
    branches:
      - main
      - helm-chart
  workflow_call:
    inputs:
      version:
        description: "Release version without prefix (for example 1.2.3), used for image tags, chart version and the binary version"
        type: string
        required: false
        default: ""
      ref:
        description: "Commit to build, empty for the commit of the triggering event"
        type: string
        required: false
        default: ""
      previous_tag:
        description: "Newest release tag at planning time; the run is refused when a newer release exists by now"
        type: string
        required: false
        default: ""


# Published releases (manual) wait for a running nightly release and the other way round: they use the group of the nightly
# workflow, `nightly-patch-release`, which spans its whole run (plan, image, chart, creation of the tag). So an older release
# cannot be published in the gap between the image push and the creation of the tag of a nightly release, and a nightly
# release starts after a manual one has finished and plans from the new tag.
# The image run that is called by the nightly workflow does not use the group: it is already inside the lock of its caller, and
# the same group would make it wait for its own caller. Branch and pull request runs get a group of their own.
# A pending run is replaced by a newer pending one, which only happens when more than two releases are started within one run.
concurrency:
  group: ${{ github.event_name == 'release' && 'nightly-patch-release' || format('build-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: harbor-day2-operator
  # Trivy version of all scan and SBOM steps, kept up to date by Renovate (customManagers in renovate.json).
  # renovate: datasource=github-releases depName=aquasecurity/trivy
  SCANNER_TRIVY_VERSION: v0.76.2

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # keyless signing with cosign (GitHub OIDC)

    steps:
    - name: Refuse a release tag that is invalid or older than the newest release
      if: ${{ github.event_name == 'release' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.event.release.tag_name }}
        IS_ACT: ${{ github.event.act }}
      run: |
        set -euo pipefail
        # vX.Y.Z or vX.Y.Z-rc.1 as in SemVer 2.0 (no leading zeros, no empty identifiers, no build metadata, which Docker tags cannot hold);
        # tags without the prefix, like the older 1.3.0, are not released any more
        re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'
        if [[ ! "$TAG" =~ $re ]]; then
          echo "The release tag '$TAG' is not of the form vX.Y.Z (or vX.Y.Z-rc.1). Nothing was built or published." >&2
          exit 1
        fi
        # A stable release that is older than the newest one would overwrite the shared image tags `X.Y`, `X` and `latest` of the
        # newer release. Prereleases do not touch them.
        # Not under Act (local runs): the GitHub API is not reachable there
        if [[ "$TAG" != *-* && -z "$IS_ACT" ]]; then
          refs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq ".[].ref")
          newest=$(printf '%s\n' "$refs" | sed 's#^refs/tags/##' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1 || true)
          if [[ -n "$newest" && "$newest" != "$TAG" ]]; then
            echo "A newer release exists: $newest. $TAG is older, so it would overwrite the shared image tags. Nothing was built or published." >&2
            exit 1
          fi
        fi

    - name: Refuse to publish an outdated release plan
      if: ${{ inputs.version != '' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ inputs.version }}
        PREVIOUS_TAG: ${{ inputs.previous_tag }}
        REF: ${{ inputs.ref || github.sha }}
      run: |
        # A re-run of an older nightly run reuses its plan; it must not overwrite a version that a later run released
        # or publish commits that are no longer the head of main.
        set -euo pipefail
                # Fetched on its own, so that a failing API call aborts the step instead of counting as "no tag found"
        refs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/" --jq ".[].ref")
        existing=$(printf '%s\n' "$refs" | grep -cxE "refs/tags/v${VERSION//./\\.}" || true)
        if [[ "$existing" != "0" ]]; then
          echo "Tag v${VERSION} already exists, so this plan is outdated. Start a new run of the nightly workflow." >&2
          exit 1
        fi
        # A release that was published after the plan was made (for example a manual minor release) makes the plan obsolete as well
        if [[ -n "$PREVIOUS_TAG" ]]; then
          newest=$(printf '%s\n' "$refs" | sed 's#^refs/tags/##' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1 || true)
          if [[ "$newest" != "$PREVIOUS_TAG" ]]; then
            echo "The newest release is ${newest:-none}, but the plan was made from ${PREVIOUS_TAG}. Start a new run of the nightly workflow." >&2
            exit 1
          fi
        fi
        main=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
        if [[ "$main" != "$REF" ]]; then
          echo "Planned commit $REF is not the head of main ($main) any more. Start a new run of the nightly workflow." >&2
          exit 1
        fi

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}

    - name: Run Ruff Check
      uses: astral-sh/ruff-action@v4.1.0
      with:
        src: "./src"
        args: check --fix

    - name: Run Ruff Format
      uses: astral-sh/ruff-action@v4.1.0
      with:
        src: "./src"
        args: format

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.15"

    - name: Install dependencies for the tests
      run: pip install -r requirements.txt -r test_requirements.txt

    - name: Run tests
      run: python -m pytest tests

    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@v3.5.0
      with:
        dockerfile: Dockerfile

    - name: Log in to the container registry
      if: ${{ !github.event.act }}
      uses: docker/login-action@3227f5311cb93ffd14d13e65d8cc400d30f4dd8a
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for container
      if: ${{ !github.event.act }}
      id: meta
      uses: docker/metadata-action@ed95091677497158a9ff38b314264cd965388d5e
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        tags: |
          # A called release run does not move the branch tag: `main` belongs to the builds of pushes to main.
          type=ref,event=branch,enable=${{ inputs.version == '' }}
          type=ref,event=pr
          type=semver,pattern={{version}},value=${{ inputs.version }}
          type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
          type=semver,pattern={{major}},value=${{ inputs.version }}
          type=sha

    - name: Set version
      id: version
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [[ -n "$INPUT_VERSION" ]]; then
          VERSION=$INPUT_VERSION
        elif [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
        else
          VERSION=0.0.0-dev
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build container image for test
      uses: docker/build-push-action@64c9b141502b80dbbd71e008a0130ad330f480f8
      with:
        context: .
        push: false
        tags: ${{ env.IMAGE_NAME }}:test
        build-args: HARBOR_OPERATOR_VERSION=${{ env.VERSION }}

    - name: Test harbor binary
      run: |
        docker run --rm \
          -e ADMIN_PASSWORD_NEW=test \
          -e HARBOR_API_URL=https://example.com \
          -e CONFIG_FOLDER_PATH=/config \
          ${{ env.IMAGE_NAME }}:test --version

    # The image that is scanned is the image that is pushed and signed: it is built once, scanned, then pushed.
    - name: Build the image to publish
      if: ${{ !github.event.act }}
      uses: docker/build-push-action@64c9b141502b80dbbd71e008a0130ad330f480f8
      with:
        context: .
        load: true
        push: false
        build-args: HARBOR_OPERATOR_VERSION=${{ env.VERSION }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Name the image to scan and push
      id: image
      if: ${{ !github.event.act }}
      env:
        TAGS: ${{ steps.meta.outputs.tags }}
      run: |
        first=$(printf '%s\n' "$TAGS" | head -n 1)
        echo "ref=${first}" >> "$GITHUB_OUTPUT"
        echo "repository=${first%:*}" >> "$GITHUB_OUTPUT"

    # Fails the build for HIGH and CRITICAL vulnerabilities that have a fixed version, so such an image is never pushed.
    # Pull requests are only reported (exit code 0), otherwise the update that fixes the finding could not be merged.
    # Accepted findings go into .trivyignore (with a comment and an expiry date), which Trivy reads by itself.
    # Pinned to commit SHAs: in March 2026 most version tags of trivy-action were rewritten to malicious commits.
    - name: Scan the image with Trivy
      if: ${{ !github.event.act }}
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ steps.image.outputs.ref }}
        version: ${{ env.SCANNER_TRIVY_VERSION }}
        scanners: vuln
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        format: table
        exit-code: ${{ github.event_name == 'pull_request' && '0' || '1' }}

    # The Python libraries are bundled inside the PyInstaller binary, so the scan of the final image only sees the operating
    # system packages. The builder stage still has them installed in site-packages (with their dependencies); it is scanned
    # with the same gate. The build tools (pip with its vendored copies, setuptools, wheel, pyinstaller) are not shipped and are skipped.
    - name: Build the builder stage to scan the Python libraries
      if: ${{ !github.event.act }}
      uses: docker/build-push-action@64c9b141502b80dbbd71e008a0130ad330f480f8
      with:
        context: .
        target: builder
        load: true
        push: false
        tags: ${{ env.IMAGE_NAME }}:builder-scan

    - name: Scan the Python libraries with Trivy
      if: ${{ !github.event.act }}
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        # Libraries only: the builder stage also has build-only OS packages (build-base, openssl-dev, glibc-dev) that are
        # not in the published image; the OS packages of the published image are scanned above.
        TRIVY_PKG_TYPES: library
      with:
        image-ref: ${{ env.IMAGE_NAME }}:builder-scan
        version: ${{ env.SCANNER_TRIVY_VERSION }}
        scanners: vuln
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        format: table
        exit-code: ${{ github.event_name == 'pull_request' && '0' || '1' }}
        skip-dirs: "**/site-packages/pip,**/site-packages/setuptools,**/site-packages/pkg_resources"
        skip-files: "**/site-packages/pip-*.dist-info/METADATA,**/site-packages/setuptools-*.dist-info/METADATA,**/site-packages/pyinstaller*.dist-info/METADATA,**/site-packages/pyinstaller_hooks_contrib*.dist-info/METADATA,**/site-packages/altgraph*.dist-info/METADATA,**/site-packages/wheel*.dist-info/METADATA"

    # The checks of the first step ran before the tests, the build and the scans. Repeated right before the push, so that a release
    # that was published meanwhile (for example a manual minor release) is not overwritten, for example the shared tags `1` and `1.3`.
    - name: Refuse to push when the release plan became outdated
      if: ${{ inputs.version != '' && !github.event.act }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ inputs.version }}
        PREVIOUS_TAG: ${{ inputs.previous_tag }}
        REF: ${{ inputs.ref || github.sha }}
      run: |
        set -euo pipefail
        refs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/" --jq ".[].ref")
        existing=$(printf '%s\n' "$refs" | grep -cxE "refs/tags/v${VERSION//./\\.}" || true)
        if [[ "$existing" != "0" ]]; then
          echo "Tag v${VERSION} exists now, so this plan is outdated. Nothing was pushed." >&2
          exit 1
        fi
        # Callers that do not pass previous_tag are not checked for a newer release, like in the first guard
        if [[ -n "$PREVIOUS_TAG" ]]; then
          newest=$(printf '%s\n' "$refs" | sed 's#^refs/tags/##' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1 || true)
          if [[ "$newest" != "$PREVIOUS_TAG" ]]; then
            echo "The newest release is ${newest:-none}, but the plan was made from ${PREVIOUS_TAG}. Nothing was pushed." >&2
            exit 1
          fi
        fi
        main=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
        if [[ "$main" != "$REF" ]]; then
          echo "Planned commit $REF is not the head of main ($main) any more. Nothing was pushed." >&2
          exit 1
        fi

    # Re-running only the failed jobs of an older release run keeps the result of the first step. Checked again right before the push,
    # so that an older stable release never overwrites the shared image tags `X.Y`, `X` and `latest` of a newer one.
    - name: Refuse to push an older stable release
      if: ${{ github.event_name == 'release' && !github.event.act && !contains(github.event.release.tag_name, '-') }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.event.release.tag_name }}
      run: |
        set -euo pipefail
        refs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v" --jq ".[].ref")
        newest=$(printf '%s\n' "$refs" | sed 's#^refs/tags/##' | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -1 || true)
        if [[ -n "$newest" && "$newest" != "$TAG" ]]; then
          echo "A newer release exists: $newest. $TAG is older, so it would overwrite the shared image tags. Nothing was pushed." >&2
          exit 1
        fi

    - name: Push the scanned image
      id: push
      if: ${{ github.event_name != 'pull_request' && !github.event.act }}
      env:
        REF: ${{ steps.image.outputs.ref }}
        REPOSITORY: ${{ steps.image.outputs.repository }}
      run: |
        set -euo pipefail
        docker push --all-tags "$REPOSITORY"
        digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$REF" | grep -F "${REPOSITORY}@" | head -n 1 | cut -d@ -f2)
        if [[ "$digest" != sha256:* ]]; then
          echo "No digest of the pushed image found" >&2
          exit 1
        fi
        echo "digest=${digest}" >> "$GITHUB_OUTPUT"

    - name: Install cosign
      if: ${{ steps.push.outcome == 'success' }}
      uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

    # Keyless: the signature is bound to the identity of this workflow (GitHub OIDC) and recorded in the Rekor log.
    # It signs the digest, so all tags of the image are covered.
    - name: Sign and verify the image
      if: ${{ steps.push.outcome == 'success' }}
      env:
        IMAGE: ${{ steps.image.outputs.repository }}@${{ steps.push.outputs.digest }}
      run: |
        set -euo pipefail
        cosign sign --yes "$IMAGE"
        cosign verify \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/build-and-publish-container-image\.yaml@" \
          "$IMAGE" > /dev/null
        echo "Signed and verified \`$IMAGE\`" >> "$GITHUB_STEP_SUMMARY"

    # SBOM (CycloneDX) of the pushed image: the operating system packages of the image plus the Python libraries, which are
    # bundled inside the PyInstaller binary and therefore only visible in the builder stage. Same exclusions as the library scan.
    - name: Generate the SBOM of the operating system packages
      if: ${{ steps.push.outcome == 'success' }}
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ steps.image.outputs.ref }}
        version: ${{ env.SCANNER_TRIVY_VERSION }}
        format: cyclonedx
        output: sbom-os.cdx.json
        exit-code: "0"

    - name: Generate the SBOM of the Python libraries
      if: ${{ steps.push.outcome == 'success' }}
      uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      env:
        TRIVY_PKG_TYPES: library
      with:
        image-ref: ${{ env.IMAGE_NAME }}:builder-scan
        version: ${{ env.SCANNER_TRIVY_VERSION }}
        format: cyclonedx
        output: sbom-python.cdx.json
        exit-code: "0"
        skip-dirs: "**/site-packages/pip,**/site-packages/setuptools,**/site-packages/pkg_resources"
        skip-files: "**/site-packages/pip-*.dist-info/METADATA,**/site-packages/setuptools-*.dist-info/METADATA,**/site-packages/pyinstaller*.dist-info/METADATA,**/site-packages/pyinstaller_hooks_contrib*.dist-info/METADATA,**/site-packages/altgraph*.dist-info/METADATA,**/site-packages/wheel*.dist-info/METADATA"

    - name: Merge the SBOMs
      if: ${{ steps.push.outcome == 'success' }}
      run: python3 -I .github/sbom/merge_sbom.py sbom-os.cdx.json sbom-python.cdx.json sbom.cdx.json

    # Signed attestation on the image digest (keyless, like the image signature), verified in the same run.
    - name: Attest and verify the SBOM
      if: ${{ steps.push.outcome == 'success' }}
      env:
        IMAGE: ${{ steps.image.outputs.repository }}@${{ steps.push.outputs.digest }}
      run: |
        set -euo pipefail
        cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE"
        cosign verify-attestation --type cyclonedx \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          --certificate-identity-regexp "^https://github\.com/${GITHUB_REPOSITORY}/\.github/workflows/build-and-publish-container-image\.yaml@" \
          "$IMAGE" > /dev/null
        echo "SBOM attached to \`$IMAGE\` and verified" >> "$GITHUB_STEP_SUMMARY"

    - name: Keep the SBOM as a build artifact
      if: ${{ steps.push.outcome == 'success' }}
      uses: actions/upload-artifact@v7
      with:
        name: sbom
        path: sbom.cdx.json

  # A manually published release gets the SBOM as an asset. The nightly release workflow attaches it when it creates the release.
  attach-sbom:
    name: Attach the SBOM to the release
    needs: build-and-push-image
    if: ${{ github.event_name == 'release' && needs.build-and-push-image.result == 'success' && !github.event.act }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download the SBOM
      uses: actions/download-artifact@v8
      with:
        name: sbom

    - name: Upload the SBOM to the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.event.release.tag_name }}
      run: |
        set -euo pipefail
        # The file name carries the version without a `v` prefix
        mv sbom.cdx.json "harbor-day2-operator-${TAG#v}.cdx.json"
        gh release upload "$TAG" "harbor-day2-operator-${TAG#v}.cdx.json" --repo "$GITHUB_REPOSITORY" --clobber

  # Announces manual releases (published GitHub release) in the Teams release channel. Builds called by the nightly
  # release workflow are announced there, and branch and pull request builds are not announced. The steps skip
  # themselves while the secret is empty.
  notify-release:
    name: Notify Teams
    needs: build-and-push-image
    if: ${{ always() && github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions: {}
    env:
      MS_TEAMS_RELEASE_WEBHOOK: ${{ secrets.STEADOPS_RELEASE_MS_TEAMS_WEBHOOK }}
    steps:
    - name: Name the version without prefix
      run: echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      env:
        TAG: ${{ github.event.release.tag_name }}
    - name: Notify MS Teams about the published image
      if: ${{ needs.build-and-push-image.result == 'success' && env.MS_TEAMS_RELEASE_WEBHOOK != '' }}
      continue-on-error: true
      uses: steadforce/steadops-workflows/.github/actions/teams-notification@v4.3.0
      with:
        webhook-url: ${{ env.MS_TEAMS_RELEASE_WEBHOOK }}
        status: success
        title: "Image ${{ github.event.release.tag_name }} published"
        facts: |
          Image=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.RELEASE_VERSION }}
          Release=${{ github.event.release.html_url }}
    - name: Notify MS Teams about the failed image
      if: ${{ needs.build-and-push-image.result != 'success' && env.MS_TEAMS_RELEASE_WEBHOOK != '' }}
      continue-on-error: true
      uses: steadforce/steadops-workflows/.github/actions/teams-notification@v4.3.0
      with:
        webhook-url: ${{ env.MS_TEAMS_RELEASE_WEBHOOK }}
        status: failure
        title: "Image ${{ github.event.release.tag_name }} failed"
        facts: |
          Build=${{ needs.build-and-push-image.result }}
          Release=${{ github.event.release.html_url }}
