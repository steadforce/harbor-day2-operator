name: Create and publish k8s workbench container image

on:
  push:
    branches:
    - "**"
  pull_request:
    branches:
    - "main"
  release:
    types: [published]
    branches:
      - main
      - helm-chart
  workflow_call:
    inputs:
      version:
        description: "Release version without prefix (for example 1.2.3), used for image tags, chart version and the binary version"
        type: string
        required: false
        default: ""
      ref:
        description: "Commit to build, empty for the commit of the triggering event"
        type: string
        required: false
        default: ""


env:
  REGISTRY: ghcr.io
  IMAGE_NAME: harbor-day2-operator

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Refuse to publish an outdated release plan
      if: ${{ inputs.version != '' }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VERSION: ${{ inputs.version }}
        REF: ${{ inputs.ref || github.sha }}
      run: |
        # A re-run of an older nightly run reuses its plan; it must not overwrite a version that a later run released
        # or publish commits that are no longer the head of main.
        set -euo pipefail
        existing=$(gh api "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/${VERSION}" --jq "map(select(.ref == \"refs/tags/${VERSION}\")) | length")
        if [[ "$existing" != "0" ]]; then
          echo "Tag ${VERSION} already exists, so this plan is outdated. Start a new run of the nightly workflow." >&2
          exit 1
        fi
        main=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
        if [[ "$main" != "$REF" ]]; then
          echo "Planned commit $REF is not the head of main ($main) any more. Start a new run of the nightly workflow." >&2
          exit 1
        fi

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}

    - name: Run Ruff Check
      uses: astral-sh/ruff-action@v4.1.0
      with:
        src: "./src"
        args: check --fix

    - name: Run Ruff Format
      uses: astral-sh/ruff-action@v4.1.0
      with:
        src: "./src"
        args: format

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.15"

    - name: Install dependencies for the tests
      run: pip install -r requirements.txt -r test_requirements.txt

    - name: Run tests
      run: python -m pytest tests

    - name: Lint Dockerfile
      uses: hadolint/hadolint-action@v3.5.0
      with:
        dockerfile: Dockerfile

    - name: Log in to the container registry
      if: ${{ !github.event.act }}
      uses: docker/login-action@3227f5311cb93ffd14d13e65d8cc400d30f4dd8a
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for container
      if: ${{ !github.event.act }}
      id: meta
      uses: docker/metadata-action@ed95091677497158a9ff38b314264cd965388d5e
      with:
        images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}},value=${{ inputs.version }}
          type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
          type=semver,pattern={{major}},value=${{ inputs.version }}
          type=sha

    - name: Set version
      id: version
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        if [[ -n "$INPUT_VERSION" ]]; then
          VERSION=$INPUT_VERSION
        elif [[ "${{ github.ref }}" == "refs/tags/"* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        else
          VERSION=0.0.0-dev
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Build container image for test
      uses: docker/build-push-action@64c9b141502b80dbbd71e008a0130ad330f480f8
      with:
        context: .
        push: false
        tags: ${{ env.IMAGE_NAME }}:test
        build-args: HARBOR_OPERATOR_VERSION=${{ env.VERSION }}

    - name: Test harbor binary
      run: |
        docker run --rm \
          -e ADMIN_PASSWORD_NEW=test \
          -e HARBOR_API_URL=https://example.com \
          -e CONFIG_FOLDER_PATH=/config \
          ${{ env.IMAGE_NAME }}:test --version

    - name: Tag and push tested container image
      uses: docker/build-push-action@64c9b141502b80dbbd71e008a0130ad330f480f8
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' && !github.event.act }}
        build-args: HARBOR_OPERATOR_VERSION=${{ env.VERSION }}
        tags: ${{ github.event.act && steps.meta-local.outputs.tags || steps.meta.outputs.tags }}
        labels: ${{ github.event.act && steps.meta-local.outputs.labels || steps.meta.outputs.labels }}