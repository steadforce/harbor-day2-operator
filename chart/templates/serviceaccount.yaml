# The operator does not call the Kubernetes API: its secrets and files reach it as environment variables and mounted files,
# which the kubelet provides. The service account therefore has no Role and no token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "harbor-day2-operator.fullname" . }}
  labels:
    {{- include "harbor-day2-operator.labels" . | nindent 4 }}
automountServiceAccountToken: false
