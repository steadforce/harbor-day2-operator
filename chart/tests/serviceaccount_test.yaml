suite: operator service account
templates:
  - templates/serviceaccount.yaml
release:
  name: operator
  namespace: harbor
tests:
  - it: names the service account after the full name
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: operator-harbor-day2-operator

  - it: follows the full name override
    set:
      fullnameOverride: custom-operator
    asserts:
      - equal:
          path: metadata.name
          value: custom-operator

  - it: does not mount an API token into the pods
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: false

  # The operator needs no Kubernetes API permissions (its secrets and files arrive as environment variables and mounted
  # files), so the chart creates nothing but the service account.
  - it: creates no role and no role binding
    asserts:
      - hasDocuments:
          count: 1
